# Production nginx config for Render.
#
# Single-origin routing: React SPA + Symfony /api/* share one domain.
#
# Render injects $PORT at container start; entrypoint.sh substitutes
# __PORT__ below before invoking nginx.

server {
    listen __PORT__ default_server;
    server_name _;

    client_max_body_size 100M;

    # ----- Block sensitive paths / files -----
    location ~ /\. { deny all; }
    location ~* \.(env|git|htaccess|json|lock|yml|yaml|md|ini|bak|swp)$ { deny all; }
    # Block Symfony / project source dirs (NOT frontend /assets/, which
    # is React's public build directory and is served from
    # frontend/dist/assets/ by the rule below).
    location ~ ^/(vendor|src|tests|bin|config|migrations|docker|var)/ { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # ----- React static assets -----
    location /assets/ {
        alias /var/www/frontend/dist/assets/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        alias /var/www/frontend/dist/favicon.svg;
        access_log off;
    }

    # ----- Symfony API + OAuth + email verification routes -----
    # These three prefixes are the only Symfony entry points that
    # bypass the front controller and need explicit routing here so
    # they don't fall through to the React SPA fallback below.
    location ^~ /api/ {
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /connect/ {
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /verify/ {
        try_files $uri /index.php$is_args$args;
    }
    # Machine-to-machine endpoint hit by external cron.org to drain
    # the Symfony Messenger `async` queue. Mirrors the structure of
    # the /api/, /connect/, /verify/ blocks above so POST requests
    # are forwarded to index.php instead of falling through to the
    # SPA fallback (which would 405 the request).
    location ^~ /messenger/ {
        try_files $uri /index.php$is_args$args;
    }

    # ----- PHP front controller -----
    location ~ \.php$ {
        root /var/www/public;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # ----- React SPA fallback -----
    # Any non-API, non-asset path that doesn't match a static file
    # gets index.html so React Router can handle the route.
    location / {
        root /var/www/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version in error pages.
    server_tokens off;
}
