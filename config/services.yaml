# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
        mailer.from_address: '%env(MAILER_FROM_ADDRESS)%'
        mailer.from_name: '%env(MAILER_FROM_NAME)%'
        cloudinary.cloud_name: '%env(CLOUDINARY_CLOUD_NAME)%'
        cloudinary.api_key: '%env(CLOUDINARY_API_KEY)%'
        cloudinary.api_secret: '%env(CLOUDINARY_API_SECRET)%'
        app.frontend_url: '%env(FRONTEND_URL)%'
        messenger.cron_token: '%env(MESSENGER_CRON_TOKEN)%'
        # Used by OriginValidationSubscriber as the Origin/Referer allowlist
        # for authenticated state-changing requests. Mirrors CORS_ALLOW_ORIGIN
        # (consumed by nelmio_cors for preflight handling) so both checks
        # agree on what counts as the legitimate frontend origin.
        app.cors_allow_origin: '%env(CORS_ALLOW_ORIGIN)%'
        salesforce.login_url: '%env(SALESFORCE_LOGIN_URL)%'
        salesforce.client_id: '%env(SALESFORCE_CLIENT_ID)%'
        salesforce.client_secret: '%env(SALESFORCE_CLIENT_SECRET)%'
        salesforce.api_version: '%env(SALESFORCE_API_VERSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
    App\Security\EmailVerifier:
        arguments:
            $mailerFromAddress: '%mailer.from_address%'
            $mailerFromName: '%mailer.from_name%'
    App\Security\OAuthSuccessHandler:
        arguments:
            $frontendUrl: '%app.frontend_url%'
    App\Security\LogoutMethodRestrictionListener:
        arguments:
            # Mirrors firewalls.main.logout.path in security.yaml. Keep both
            # values in sync if the logout path ever changes.
            $logoutPath: '/api/logout'
    App\Security\OriginValidationSubscriber:
        arguments:
            $allowedOrigin: '%app.cors_allow_origin%'
    App\Controller\ResetPasswordController:
        arguments:
            $mailerFromAddress: '%mailer.from_address%'
            $mailerFromName: '%mailer.from_name%'
            $frontendUrl: '%app.frontend_url%'
    App\Controller\RegistrationController:
        arguments:
            $frontendUrl: '%app.frontend_url%'
    App\Service\CloudinarySignatureService:
        arguments:
            $cloudName: '%cloudinary.cloud_name%'
            $apiKey: '%cloudinary.api_key%'
            $apiSecret: '%cloudinary.api_secret%'
    App\Service\MessengerConsumeService:
        # TransportInterface for the `async` transport is not autowireable
        # by interface — wire it explicitly via service ID.
        arguments:
            $asyncTransport: '@messenger.transport.async'
    App\Controller\MessengerConsumeController:
        arguments:
            $cronToken: '%messenger.cron_token%'
    App\Service\Salesforce\SalesforceAuthenticator:
        # Four scalars bound to backend-only env vars. The client ID
        # and secret never touch the Symfony container params that
        # get exposed to the React bundle — they are kept strictly
        # inside this one wiring block.
        arguments:
            $loginUrl: '%salesforce.login_url%'
            $clientId: '%salesforce.client_id%'
            $clientSecret: '%salesforce.client_secret%'
            $apiVersion: '%salesforce.api_version%'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
